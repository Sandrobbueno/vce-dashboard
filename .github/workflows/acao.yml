name: Ação administrativa Hotscool (cadastrar e matricular)
on:
  workflow_dispatch:
    inputs:
      lang: { description: 'Escola: es ou pt', required: true }
      nome: { required: true }
      email: { required: true }
      unidade: { description: 'id da unidade', required: true }
      departamento: { description: 'id do departamento', required: true }
      cargo: { description: 'id do cargo', required: true }
      codigo: { description: 'código externo', required: true }
      curso: { description: 'id do curso', required: true }
      programa: { description: 'chave do programa no config (ex lideranca)', required: true }
      dealer: { description: 'chave do dealer no config (ex tracbel)', required: true }
      verificar: { required: false, default: '' }
      ddd: { required: false, default: '' }
      telefone: { required: false, default: '' }
permissions:
  contents: write
jobs:
  acao:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: '3.12' }
      - name: Executar
        env:
          HOTSCOOL_KEY_ES: ${{ secrets.HOTSCOOL_KEY_ES }}
          HOTSCOOL_KEY_PT: ${{ secrets.HOTSCOOL_KEY_PT }}
        run: |
          set -o pipefail
          python3 acao.py --lang "${{ inputs.lang }}" --nome "${{ inputs.nome }}" --email "${{ inputs.email }}" \
            --unidade "${{ inputs.unidade }}" --departamento "${{ inputs.departamento }}" --cargo "${{ inputs.cargo }}" \
            --codigo "${{ inputs.codigo }}" --curso "${{ inputs.curso }}" --programa "${{ inputs.programa }}" --dealer "${{ inputs.dealer }}" \
            --verificar "${{ inputs.verificar }}" --ddd "${{ inputs.ddd }}" --telefone "${{ inputs.telefone }}" 2>&1 | tee acao.out
      - name: Commit do registro
        if: always()
        run: |
          git config user.name "vce-dashboard bot"; git config user.email "actions@users.noreply.github.com"
          git add acoes.log config_*.json acao.out
          git diff --cached --quiet || (git commit -m "Ação administrativa: ${{ inputs.email }}" && git push)
