name: Extração e dashboards semanais (Volvo CE)

on:
  schedule:
    # 07:30 America/Sao_Paulo (UTC-3) = 10:30 UTC, toda segunda. Horário de verão não se aplica (BR não tem desde 2019).
    - cron: '30 10 * * 1'
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: semanal
  cancel-in-progress: false

jobs:
  rodada:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Testar alcance da API Hotscool
        run: |
          code=$(curl -sS -o /dev/null -w "%{http_code}" https://api.hotscool.com/v1/api-docs/)
          echo "api.hotscool.com -> HTTP $code"
          test "$code" = "200"

      - name: Extrair (history/dump_es_<data>.json)
        env:
          HOTSCOOL_KEY_ES: ${{ secrets.HOTSCOOL_KEY_ES }}
        run: |
          test -n "$HOTSCOOL_KEY_ES" || { echo "Segredo HOTSCOOL_KEY_ES não cadastrado no repositório"; exit 1; }
          python3 extract.py

      - name: Gerar dashboards e corpos de e-mail (out/<data>/)
        run: python3 build.py | tee build.log

      - name: Gerar PDFs datados (04_PDFs_Semanais/)
        continue-on-error: true
        run: |
          pip install -q playwright
          python3 -m playwright install --with-deps chromium
          python3 pdf.py

      - name: Guarda de confidencialidade (saídas individuais sem rede nem outro dealer)
        run: |
          d=$(ls -1 out | sort | tail -1)
          for f in out/$d/cdm.html out/$d/cdm_email.html out/$d/ascendum.html out/$d/ascendum_email.html out/$d/rieder.html out/$d/rieder_email.html; do
            if grep -qiE "promedio de la red|media da rede|média da rede" "$f"; then echo "VIOLAÇÃO em $f"; exit 1; fi
          done
          grep -qi "ascendum\|rieder" out/$d/cdm.html out/$d/cdm_email.html && { echo "VIOLAÇÃO: CDM cita outro dealer"; exit 1; } || true
          grep -qi "cdm\|rieder" out/$d/ascendum.html out/$d/ascendum_email.html && { echo "VIOLAÇÃO: Ascendum cita outro dealer"; exit 1; } || true
          grep -qi "cdm\|ascendum" out/$d/rieder.html out/$d/rieder_email.html && { echo "VIOLAÇÃO: Rieder cita outro dealer"; exit 1; } || true
          echo "ok"

      - name: Commit dos resultados
        run: |
          git config user.name "vce-dashboard bot"
          git config user.email "actions@users.noreply.github.com"
          git add history out 04_PDFs_Semanais 2>/dev/null || git add history out
          if git diff --cached --quiet; then echo "nada novo"; exit 0; fi
          d=$(ls -1 out | sort | tail -1)
          git commit -m "Rodada semanal: dados de $d" -m "$(cat build.log)"
          git push

      - name: Resumo
        run: |
          d=$(ls -1 out | sort | tail -1)
          echo "## Rodada $d" >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY; cat build.log >> $GITHUB_STEP_SUMMARY; echo '```' >> $GITHUB_STEP_SUMMARY
