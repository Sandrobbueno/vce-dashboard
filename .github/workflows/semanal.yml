name: Extração e dashboards semanais (Volvo CE)

on:
  schedule:
    # 07:30 America/Sao_Paulo (UTC-3) = 10:30 UTC, toda segunda. Brasil não tem horário de verão desde 2019.
    - cron: '30 10 * * 1'
  workflow_dispatch:
    inputs:
      langs:
        description: 'Escolas a rodar (separadas por espaço): es pt'
        required: false
        default: 'es pt'

permissions:
  contents: write

concurrency:
  group: semanal
  cancel-in-progress: false

jobs:
  rodada:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    env:
      LANGS: ${{ github.event.inputs.langs || 'es pt' }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Testar alcance da API Hotscool
        run: |
          code=$(curl -sS -o /dev/null -w "%{http_code}" https://api.hotscool.com/v1/api-docs/)
          echo "api.hotscool.com -> HTTP $code"
          test "$code" = "200"

      - name: Preparar Chromium (PDF)
        continue-on-error: true
        run: |
          pip install -q playwright
          python3 -m playwright install --with-deps chromium

      - name: Extrair, gerar, PDF e guarda de confidencialidade (por escola)
        env:
          HOTSCOOL_KEY_ES: ${{ secrets.HOTSCOOL_KEY_ES }}
          HOTSCOOL_KEY_PT: ${{ secrets.HOTSCOOL_KEY_PT }}
        run: |
          set -e
          : > build.log
          for lang in $LANGS; do
            var="HOTSCOOL_KEY_$(echo $lang | tr a-z A-Z)"
            if [ -z "${!var}" ]; then echo "[$lang] segredo $var não cadastrado; escola pulada" | tee -a build.log; continue; fi
            echo "== escola $lang ==" | tee -a build.log
            python3 extract.py --lang $lang | tee -a build.log
            python3 build.py --lang $lang | tee -a build.log      # aborta se uma saída individual citar a rede ou outro dealer
            python3 pdf.py --lang $lang | tee -a build.log || echo "[$lang] PDF falhou (segue sem PDF)" | tee -a build.log
          done

      - name: Enviar PDFs e saídas ao Dropbox (Turmas 2026)
        continue-on-error: true
        env:
          DROPBOX_APP_KEY: ${{ secrets.DROPBOX_APP_KEY }}
          DROPBOX_APP_SECRET: ${{ secrets.DROPBOX_APP_SECRET }}
          DROPBOX_REFRESH_TOKEN: ${{ secrets.DROPBOX_REFRESH_TOKEN }}
        run: |
          for lang in $LANGS; do
            [ -d out/$lang ] && python3 dropbox_upload.py --lang $lang || echo "[$lang] sem saídas para enviar"
          done

      - name: Commit dos resultados
        run: |
          git config user.name "vce-dashboard bot"
          git config user.email "actions@users.noreply.github.com"
          git add history out 04_PDFs_Semanais 2>/dev/null || true
          if git diff --cached --quiet; then echo "nada novo"; exit 0; fi
          git commit -m "Rodada semanal: $(date -u +%Y-%m-%d)" -m "$(cat build.log)"
          git push

      - name: Resumo
        run: |
          echo '```' >> $GITHUB_STEP_SUMMARY; cat build.log >> $GITHUB_STEP_SUMMARY; echo '```' >> $GITHUB_STEP_SUMMARY
