name: Corrigir nome de aluno (Hotscool)
on:
  workflow_dispatch:
    inputs:
      lang: { description: 'Escola: es ou pt', required: true }
      email: { required: true }
      nome: { description: 'nome completo correto', required: true }
      aplicar: { description: 'sim para executar (vazio = só inspecionar)', required: false, default: '' }
      metodo: { required: false, default: 'PUT' }
      caminho: { description: 'caminho do endpoint, com {id}', required: false, default: '' }
permissions:
  contents: write
jobs:
  nome:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: '3.12' }
      - name: Executar
        env:
          HOTSCOOL_KEY_ES: ${{ secrets.HOTSCOOL_KEY_ES }}
          HOTSCOOL_KEY_PT: ${{ secrets.HOTSCOOL_KEY_PT }}
        run: |
          set -o pipefail
          python3 nome.py --lang "${{ inputs.lang }}" --email "${{ inputs.email }}" --nome "${{ inputs.nome }}" --aplicar "${{ inputs.aplicar }}" --metodo "${{ inputs.metodo }}" --caminho "${{ inputs.caminho }}" 2>&1 | tee nome.out
      - name: Commit do registro
        if: always()
        run: |
          git config user.name "vce-dashboard bot"; git config user.email "actions@users.noreply.github.com"
          git add acoes.log nome.out
          git diff --cached --quiet || (git commit -m "Correção de nome: ${{ inputs.email }}" && git pull --rebase -q && git push)
